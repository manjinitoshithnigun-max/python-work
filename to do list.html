git<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 40px 16px;
    }
    .app {
      background: #fff; width: 100%; max-width: 420px;
      border-radius: 16px; padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    h1 { font-size: 24px; margin-bottom: 20px; color: #333; text-align: center; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    #taskInput {
      flex: 1; padding: 12px 14px; font-size: 15px;
      border: 2px solid #e0e0e0; border-radius: 10px; outline: none;
    }
    #taskInput:focus { border-color: #667eea; }
    #addBtn {
      padding: 12px 18px; font-size: 15px; font-weight: bold;
      color: #fff; background: #667eea; border: none; border-radius: 10px;
      cursor: pointer; transition: background .2s;
    }
    #addBtn:hover { background: #5568d3; }
    .filters { display: flex; gap: 8px; margin-bottom: 14px; }
    .filter-btn {
      flex: 1; padding: 8px; font-size: 13px; border: 1px solid #ddd;
      background: #f7f7f7; border-radius: 8px; cursor: pointer;
    }
    .filter-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 10px; border-bottom: 1px solid #eee;
    }
    li.completed span { text-decoration: line-through; color: #aaa; }
    li span { flex: 1; cursor: pointer; word-break: break-word; }
    .del-btn {
      background: none; border: none; font-size: 18px;
      color: #e74c3c; cursor: pointer;
    }
    .footer { display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px; color: #888; }
    #clearBtn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 13px; }
    .empty { text-align: center; color: #aaa; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>✅ My To-Do List</h1>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="100">
      <button id="addBtn">Add</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <ul id="taskList"></ul>
    <div class="footer">
      <span id="count"></span>
      <button id="clearBtn">Clear completed</button>
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn    = document.getElementById('addBtn');
    const taskList  = document.getElementById('taskList');
    const countEl   = document.getElementById('count');
    const clearBtn  = document.getElementById('clearBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      taskList.innerHTML = '';
      const visible = tasks.filter(t =>
        currentFilter === 'all' ? true :
        currentFilter === 'active' ? !t.completed : t.completed
      );

      if (visible.length === 0) {
        taskList.innerHTML = '<li class="empty">No tasks here 🎉</li>';
      }

      visible.forEach(task => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.addEventListener('change', () => toggleTask(task.id));

        const span = document.createElement('span');
        span.textContent = task.text;
        span.addEventListener('dblclick', () => editTask(task.id, span));

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '🗑️';
        delBtn.addEventListener('click', () => deleteTask(task.id));

        li.append(checkbox, span, delBtn);
        taskList.appendChild(li);
      });

      const remaining = tasks.filter(t => !t.completed).length;
      countEl.textContent = remaining + ' task' + (remaining !== 1 ? 's' : '') + ' left';
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, completed: false });
      taskInput.value = '';
      taskInput.focus();
      save();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.completed = !task.completed;
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function editTask(id, span) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const newText = prompt('Edit task:', task.text);
      if (newText !== null && newText.trim()) {
        task.text = newText.trim();
        save();
        render();
      }
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      save();
      render();
    });
    filterBtns.forEach(btn => btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    }));

    render();
  </script>
</body>
</html>
